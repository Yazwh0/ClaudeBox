name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      # CI packages get a throwaway low version so any real release supersedes them.
      - name: Build
        run: dotnet build -c Release -p:Version=0.0.${{ github.run_number }}-ci

      - name: Unit tests
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/Claudebox -c Release --no-build -p:Version=0.0.${{ github.run_number }}-ci -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
